name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Eq "Version:[[:space:]]+${VERSION}$" gest-web-rent.php
          grep -Eq "define\( 'GWR_VERSION', '${VERSION}' \);" gest-web-rent.php
          grep -Eq "Stable tag:[[:space:]]+${VERSION}$" readme.txt

      - name: Prepare plugin folder
        run: |
          rm -rf build
          mkdir -p build/gest-web-rent

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.gitkeep' \
            --exclude='build' \
            --exclude='scripts' \
            --exclude='blocks' \
            --exclude='public/templates' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.DS_Store' \
            --exclude='*.zip' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            ./ build/gest-web-rent/

      - name: Validate plugin main file exists
        run: |
          test -f build/gest-web-rent/gest-web-rent.php

      - name: Validate plugin header
        run: |
          grep -q "Plugin Name: Gest Web Rent" build/gest-web-rent/gest-web-rent.php

      - name: Create ZIP
        run: |
          cd build
          zip -r gest-web-rent.zip gest-web-rent

      - name: Validate ZIP structure
        run: |
          unzip -l build/gest-web-rent.zip
          unzip -l build/gest-web-rent.zip | grep "gest-web-rent/gest-web-rent.php"
          ! unzip -l build/gest-web-rent.zip | grep -E "gest-web-rent-main|frattomella-gest-web-rent|gest-web-rent-[0-9]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/gest-web-rent.zip
          generate_release_notes: true
